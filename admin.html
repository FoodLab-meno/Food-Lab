<!doctype html>
<html lang="fa" dir="rtl">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
 <title>ورود مدیر | FoodLab</title>
 <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="admin.js"></script>
</head>
<body class="admin-page">
 <header class="admin-header"><a class="brand" href="index.html"><span class="brand-name">Food<span>Lab</span></span><small>ناحیه مدیریت</small></a><a class="admin-back" href="index.html">← بازگشت به منو</a></header>
 <main class="adminmain">
  <section id="login" class="admin-card">
   <div class="admin-intro"><span class="admin-kicker">FOODLAB · PRIVATE</span><h1>ورود مدیر</h1><p>این بخش فقط برای مدیریت و به‌روزرسانی قیمت‌های منو است.</p></div>
   <form id="loginform" class="admin-form"><label>ایمیل مدیر<input id="email" type="email" autocomplete="username" required placeholder="ایمیل حساب مدیر"></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required placeholder="رمز عبور"></label><button class="admin-button" type="submit">ورود به مدیریت</button></form>
   <p id="loginmsg" class="admin-message" role="status"></p>
  </section>
  <section id="manager" class="admin-card hidden">
   <div class="managerhead"><div class="admin-intro"><span class="admin-kicker">PRICE CONTROL</span><h1>مدیریت قیمت‌ها</h1><p>قیمت‌ها را به تومان وارد کن و ذخیره را بزن.</p></div><button id="logout" class="admin-button" type="button">خروج</button></div>
   <div class="admin-tools"><input id="search" class="admin-search" type="search" placeholder="جست‌وجوی نام محصول"><select id="filter" class="admin-filter"><option value="all">همه دسته‌ها</option><option value="breakfast">صبحانه</option><option value="sandwich">ساندویچ</option><option value="appetizer">پیش‌غذا</option><option value="cafe">کافه</option><option value="drinks">نوشیدنی</option></select></div>
   <p id="msg" class="admin-message" role="status"></p><div id="rows"></div>
  </section>
 </main>
</body>
</html>
